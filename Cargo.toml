[workspace]
members = ["crates/ogunedo-core", "program", "script"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CaptSinBad/ogunedo"
authors = ["Ifeanyi Joseph Ogunedo <josephnedo007@gmail.com>"]

[workspace.dependencies]
ogunedo-core = { path = "crates/ogunedo-core", default-features = false }
serde = { version = "=1.0.221", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "=0.10.8", default-features = false }
sp1-zkvm = { version = "=6.2.2" }
sp1-sdk = { version = "=6.2.2", features = ["native-gnark", "network"] }
sp1-build = { version = "=6.2.2" }
anyhow = "=1.0.98"
bincode = "=1.3.3"
clap = { version = "=4.5.40", features = ["derive"] }
hex = "=0.4.3"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
serde_json = "=1.0.140"
tokio = { version = "=1.45.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
