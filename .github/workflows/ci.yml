name: native-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt,clippy
          rustup default 1.91.1
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p ogunedo-core --all-targets --all-features -- -D warnings
      - name: Unit and differential tests
        run: cargo test -p ogunedo-core --all-features
      - name: Independent reference fixture
        run: |
          python3 scripts/reference_check.py
          git diff --exit-code -- fixtures/
      - name: Require committed lockfile on protected release branches
        if: startsWith(github.ref, 'refs/tags/')
        run: git diff --exit-code -- Cargo.lock
